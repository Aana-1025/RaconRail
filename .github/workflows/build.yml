name: Build shell

# Prepared locally. No remote execution or deployment is authorized by this file.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
          overwrite-settings: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Dispatcher failure policy
        run: python3 -m unittest discover -s ops -p 'test_*.py' -v
      - name: Verify build
        run: python3 ops/run_commands.py --suite build --task RR-02.2
      - name: Fetch pinned PostgreSQL test image
        run: docker pull postgres@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
      - name: Verify database migrations and roles
        run: python3 ops/run_commands.py --suite pg --task RR-03
      - name: Install pinned authentication test dependency
        run: python3 -m pip install --requirement ops/test-requirements.txt
      - name: Fetch pinned local identity test image
        run: docker pull quay.io/keycloak/keycloak@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
      - name: Verify local authentication boundary
        run: python3 ops/run_commands.py --suite security --task RR-06
